<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <!-- Setări Full Screen special pentru Safari pe iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pentru Tine ❤️">
    
    <title>Surpriză! ❤️</title>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000; /* Ecran complet negru la început */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* ECRANUL INIȚIAL BLANK (INVISIBLE TOUCH OVERLAY) */
        #blankScreen {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 99999;
            cursor: pointer;
        }

        /* OVERLAY VIDEO GLITCH FULL SCREEN */
        #glitchScreen {
            position: fixed;
            inset: 0;
            background: #050505;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #glitchVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.04) 0px,
                rgba(255, 255, 255, 0.04) 1px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
        }

        .glitch-active {
            animation: glitchShake 0.14s infinite;
            filter: contrast(150%) saturate(180%);
        }

        @keyframes glitchShake {
            0% { transform: translate(0, 0) skew(0deg); }
            20% { transform: translate(-8px, 4px) skew(-3deg); }
            40% { transform: translate(8px, -4px) skew(3deg); }
            60% { transform: translate(-6px, -2px) skew(2deg); }
            80% { transform: translate(6px, 3px) skew(-2deg); }
            100% { transform: translate(0, 0) skew(0deg); }
        }

        .glitch-text {
            position: absolute;
            bottom: calc(30px + env(safe-area-inset-bottom));
            color: #ff2a85;
            font-family: monospace;
            font-size: 1.1em;
            letter-spacing: 2px;
